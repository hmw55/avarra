services:
  postgres:
    image: postgres:17
    container_name: avarra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - avarra-postgres-data:/var/lib/postgresql/data

volumes:
  avarra-postgres-data:
